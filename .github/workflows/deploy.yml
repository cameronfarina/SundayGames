name: Deploy production

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Resume auto-deploy and deploy latest main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resume auto-deploy and trigger a deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: srv-da167clbedkc73c5f82g
        run: |
          curl -sf -X PATCH -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"autoDeploy": "yes"}' \
            "https://api.render.com/v1/services/$SERVICE_ID" > /dev/null \
            && echo "Auto-deploy is on." \
            || echo "Could not update the auto-deploy setting; continuing."
          curl -sf -X POST -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "https://api.render.com/v1/services/$SERVICE_ID/deploys"
          echo "Deploy of latest main requested."
